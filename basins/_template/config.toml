# =============================================================================
# config.toml - per-basin configuration for bmm-etg-raster-fill (simplified)
#
# Baseline method: spatially weighted per-BpS-class mean ETg.
#   No machine-learning model, no DEM, no terrain covariates.
#
# This file is generated by prep_basin.py / prep_custom_basin.py from
# basins/_template/config.toml.  Edit it freely - the prep scripts NEVER
# overwrite an existing config.toml.  To change defaults for NEW basins,
# edit the template (basins/_template/config.toml) instead of this file.
# =============================================================================

[basin]
basin_key  = "$basin_key"
basin_id   = "$basin_id"
basin_name = "$basin_name"

[source]
# User-supplied raw inputs.  Give the file NAME in quotes (drop the files in the
# basin's source/ folder; they're also found in input/).  Values MUST be quoted.
# For a full path on Windows, use forward slashes or single quotes so the
# backslashes aren't read as escape characters, e.g. 'C:\data\my_etg.tif'.
etg_tif       = "$etg_tif"          # ETg raster (ft/yr); defines the output grid
treatment_shp = "$treatment_shp"    # treatment polygons (scale_fctr / rplc_rt cols)
# boundary_shp is OPTIONAL.  When omitted, the training boundary is taken from the
# treatment shapefile's extent (ET units tile the basin, so the file defines it).
# Set it only when the treatment polygons cover less than the full basin, or to
# point at a separate basin outline.
$boundary_shp_line

[inputs]
# Prep-generated covariate, clipped to this basin (lives in input/).
bps_tif = "BpS.tif"                 # LANDFIRE Biophysical Settings

[treatment]
buffer_m         = 90.0             # buffer (m) around treatment polygons
feather_width_px = 4                # Gaussian feather sigma (px) outside the boundary
attr_scale       = "scale_fctr"     # shapefile column: polygon is treated if value > 0
attr_replace     = "rplc_rt"        # shapefile column: polygon is treated if value > 0

[adjustment]
baseline_adjust = 1.0               # basin-wide multiplier on the baseline (1.0 = none)
attr_adjust     = "adj_fctr"        # optional per-polygon override column in the shapefile

[baseline]
# Spatially weighted per-BpS-class mean.  For each BpS class, each pixel's
# baseline is a Gaussian-windowed local mean of the non-irrigated training
# pixels of that same class.  Set the radius to 0 for a flat basin-wide
# class mean (one value per class).
spatial_weight_radius_px = 33       # window radius in px (~1 km at 30 m); 0 = flat

[flag]
# Settings for flag_irrigated.py - the optional pre-screening helper that flags
# polygons whose ETg looks irrigation-inflated relative to their BpS class.
ratio_thresh  = 1.5            # flag if polygon mean ETg >= ratio_thresh x its BpS-class baseline
min_excess_ft = 0.3            # ...and at least this many ft/yr above the baseline
baseline_pctl = 50.0           # per-BpS-class baseline percentile over in-basin pixels (50 = median)
# The decision is always written into the "autoflag" attribute.

[crs_overrides]
# Fix rasters whose stored CRS is malformed.  Key = file stem, value = CRS.
# Example:
# BpS = "EPSG:5070"
